# Storyboard for docs/video_scripts/dakmeting/11_dakproject_met_twee_daken.md
# A roof project with two roofs, from the drawing to the quotation: plans,
# scaling, original and future state, the Dakopbouw and Randafwerking
# wizards, general works, safety, demolition per roof, the site and the
# quotation. Demo data: stage two_roofs in seed_demo.py; the canvas clicks
# are in pixels of the plans of make_plans.py.


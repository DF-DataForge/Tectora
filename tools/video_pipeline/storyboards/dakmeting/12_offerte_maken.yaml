# Storyboard for docs/video_scripts/dakmeting/12_offerte_maken.md
# The quotation from the roof measurement: the quote panel by the drawing,
# the Offerte tab, Offerte maken, a line on the order, a change on the
# drawing and Offerte bijwerken uit meting, one VAT rate, the pdf and
# sending it. Starts from video 11's roof project (prepare: its shots
# 3-16, off camera). Demo data: stage two_roofs in seed_demo.py.

